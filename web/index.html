<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workshop Graph Explorer</title>

    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/search.css" />
    <link rel="stylesheet" href="./styles/graph.css" />
    <link rel="stylesheet" href="./styles/detail.css" />
  </head>

  <body>
    <div class="app">
      <aside class="sidebar">
        <h1 class="sidebar__title">Workshop Dependency Graph</h1>

        <div class="field">
          <label for="gameSelect">Game</label>
          <select id="gameSelect" disabled></select>
        </div>

        <div class="field search">
          <label for="searchInput">Search</label>
          <input
            id="searchInput"
            type="text"
            placeholder="Search mods..."
            autocomplete="off"
            spellcheck="false"
          />
          <div id="searchResults" class="search-results" hidden></div>
        </div>

        <div class="field">
          <label for="depthSlider" id="depthLabel">Depth: 2</label>
          <input id="depthSlider" type="range" min="1" max="3" step="1" value="2" />
        </div>

        <div class="field">
          <label for="layoutSelect">Layout</label>
          <select id="layoutSelect">
            <option value="dagre" selected>dagre</option>
            <option value="breadthfirst">breadthfirst</option>
            <option value="cose">cose</option>
          </select>
        </div>

        <div class="sidebar__stats">
          <div class="stat"><span class="badge">Nodes</span><span id="statNodes">-</span></div>
          <div class="stat"><span class="badge">Edges</span><span id="statEdges">-</span></div>
          <div class="stat"><span class="badge">Mods</span><span id="statMods">-</span></div>
          <div class="stat"><span class="badge">Cycles</span><span id="statCycles">-</span></div>
        </div>
      </aside>

      <main class="graph">
        <div id="cy"></div>
        <div class="truncation-banner" id="truncation" hidden></div>
        <div class="overlay" id="overlay">
          <div class="overlay__message" id="overlayMessage">
            Select a mod to view its dependency graph
          </div>
        </div>
      </main>
    </div>

    <aside id="detail" class="detail" hidden aria-label="Mod details">
      <div class="detail__header">
        <h2 class="detail__title" id="detailTitle"></h2>
        <button class="detail__close" id="detailClose" type="button" aria-label="Close panel">
          &#10005;
        </button>
      </div>
      <div class="detail__obsolete" id="detailObsolete" hidden>
        This mod is marked obsolete
      </div>
      <div class="detail__body" id="detailBody"></div>
    </aside>

    <!-- Vendored graph libraries (UI-SPEC: Cytoscape 3.29.2 via CDN).
         Classic scripts run before the deferred module below. -->
    <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
    <script src="https://unpkg.com/cytoscape@3.29.2/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
